# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/scrollytelling.schema.json
#
# The story on scrollytelling.html. The map stays on screen while the
# chapters scroll over it; each chapter moves the camera and can show or hide
# layers. Chapter text (`description`) is HTML, not Markdown.
type: scrollytelling
id: nyc-story
theme: light
cameraOffset: false
projection:
  type: globe
           # chapter cards: light or dark
showMarkers: true      # a dot per chapter at the right edge; click one to jump
markerColor: "#000000"  # color of the chapter markers

# The map when the page opens.

config:
  mapStyle:
    version: 8
    sources:
      satellite:
        type: raster
        url: "https://api.maptiler.com/tiles/satellite-v2/tiles.json?key=Reh8zANfAiDQXPWmTT2r"
        tileSize: 512
    layers:
      - id: satellite
        type: raster
        source: satellite

  center: [-42.0, 72.0]
  zoom: 4
  interactive: false

# Every layer the story uses. A layer that a chapter reveals later starts
# hidden with `layout: { visibility: none }`.
layers:
  - id: Greenland_Bed_Visual
    type: raster
    source:
      type: raster
      tiles:
        - "Greenaland_Bed_Visual/{z}/{x}/{y}.png"
      tileSize: 256
      minzoom: 0
      maxzoom: 7
    layout:
      visibility: none
    paint:
      raster-opacity: 0.85

  - id: stream-ice-8000
    type: line
    source:
      type: geojson
      url: "data/stream-ice-8000.geojson"
    layout:
      visibility: none
      line-join: round
      line-cap: round
    paint:
      line-color: "#36D9FF"
      line-width: 0.5
      line-opacity: 0.85

  - id: squirrels
    type: circle
    source:
      type: geojson
      url: "data/squirrel20241021.geojson"
    layout:
      visibility: none
    paint:
      circle-radius: 4
      circle-color: "#826260"
      circle-opacity: 0.8

  - id: central-park
    type: fill
    source:
      type: geojson
      data:
        type: Feature
        properties: { name: Central Park }
        geometry:
          type: Polygon
          coordinates:
            - - [-73.9730, 40.7644]
              - [-73.9819, 40.7681]
              - [-73.9580, 40.8006]
              - [-73.9496, 40.7968]
              - [-73.9730, 40.7644]
    layout:
      visibility: none
    paint:
      fill-color: "#4caf50"
      fill-opacity: 0.35

chapters:
  - id: intro
    title: Matter, Unwritten
    description: >-
      <p>Greenland's vast ice sheet appears still, yet beneath its
      surface lies a dynamic landscape shaped by ice, water, and
      geological processes.</p>
      <p>This interactive atlas reveals the hidden structures and
      movements beneath the ice, tracing how unseen processes shape
      the landscape and generate new material possibilities.</p>
    center: [-42.0, 72.0]
    zoom: 3
    alignment: left
    layers:
      hide: [Greenland_Bed_Visual]

  - id: squirrels
    title: Beneath the Ice
    description: >-
      <p>Greenland's vast ice sheet conceals a complex landscape of
      mountains, valleys, and deep basins. Using NASA's BedMachine
      Greenland v7 dataset, this map reveals the estimated elevation
      of the bedrock beneath the ice, exposing a terrain normally
      hidden from view.</p>
      <p><small>Data Source: NASA / NSIDC — BedMachine Greenland v7</small></p>
    center: [-42.0, 72.0]
    zoom: 3
    bearing: 0
    alignment: left
    layers:
      show: [Greenland_Bed_Visual]
      hide: [stream-ice-8000]

  - id: streams
    title: Water in Motion
    description: >-
      <p>Beneath Greenland's ice sheet, meltwater travels
      through a network of drainage pathways. This map
      visualizes modelled stream paths, revealing the
      hidden structure of water movement beneath the ice.</p>
    center: [-42.0, 72.0]
    zoom: 3
    pitch: 0
    bearing: 0
    alignment: left
    layers:
      show: [stream-ice-8000]

  - id: stream-detail
    title: Following the Flow
    description: >-
      <p>Moving particles trace Greenland's modelled
      drainage pathways beneath the ice.</p>
    center: [-42.0, 72.0]
    zoom: 5
    pitch: 0
    bearing: 0
    alignment: left
    layers:
      show: [stream-ice-8000]

  - id: mississippi
    title: Pictures in a chapter
    description: >-
      <p>A chapter can show an image above its text with <code>image:</code>,
      a file in <code>img/</code>. This is Harold Fisk's 1944 map of the
      Mississippi's ancient courses, near where the map has flown to.</p>
    image: "img/fisk02.jpg"
    center: [-42.0, 80.0]
    zoom: 2.5
    pitch: 0
    bearing: 0
    alignment: center

    layers:
      hide: [central-park]

  - id: outro
    title: Back to New York
    description: >-
      <p><code>rotateAnimation: true</code> turns the camera slowly while this
      chapter is on screen. Edit <code>stories/nyc.yaml</code> to write
      your own story.</p>
    center: [-42.0, 80.0]
    zoom: 2.5
    pitch: 0
    bearing: 0
    alignment: center


footer: >-
  <p>Data: 2018 Central Park Squirrel Census (NYC Open Data). Basemap:
  OpenFreeMap, © OpenStreetMap contributors.</p>

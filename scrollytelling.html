
<!DOCTYPE html>
<html lang="en" class="atlas-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Matter, Unwritten | Greenland Atlas</title>
  <meta name="description" content="An interactive atlas of Greenland's hidden landscape.">

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/site.css">

  <script type="importmap">
    {
      "imports": {
        "maplibre-gl": "https://unpkg.com/maplibre-gl@6/dist/maplibre-gl.mjs"
      }
    }
  </script>

  <script type="module"
    onerror="document.dispatchEvent(new Event('atlas-library-error'))"
    src="https://unpkg.com/@maplibre-yaml/core@0.10/register.js">
  </script>
</head>

<body class="bleed">
  <section class="atlas-loader" role="status" aria-live="polite" aria-label="Loading atlas">
    <div class="atlas-loader-content">
      <span class="atlas-loader-spinner" aria-hidden="true"></span>
      <h1>Loading…</h1>
      <p class="atlas-loader-detail">Preparing the atlas</p>
      <p class="atlas-loader-count">0 / 4</p>
      <button class="atlas-loader-retry" type="button" hidden>Retry</button>
    </div>
  </section>
  <script type="module" src="js/startup.js"></script>
  <header class="site-header">
    <div class="container">
      <a class="site-name" href="./">Matter, Unwritten</a>

      <nav class="site-nav">
        <a href="inline-maps.html">Inline maps</a>
        <a href="full-page-map.html">Full page map</a>
        <a href="scrollytelling.html" aria-current="page">Scrollytelling</a>
      </nav>
    </div>
  </header>

  <main>
    <ml-scrollytelling src="stories/nyc.yaml"></ml-scrollytelling>
  </main>

  <p class="ice-velocity-status" role="status" hidden>Loading annual images…</p>
  <aside class="ice-velocity-legend" aria-label="Ice speed legend, 0 to 4000, linear scale" hidden>
    <h3>Ice speed <span class="ice-velocity-unit">(m/yr)</span></h3>
    <div class="ice-velocity-scale">
      <div class="ice-velocity-scale-bar" aria-hidden="true"></div>
      <div class="ice-velocity-scale-labels">
        <span style="bottom: 100%">4,000</span>
        <span style="bottom: 50%">2,000</span>
        <span style="bottom: 25%">1,000</span>
        <span style="bottom: 7.5%">300</span>
        <span style="bottom: 0%">0</span>
      </div>
    </div>
  </aside>
  <script type="module" src="js/ice-velocity.js"></script>

  <aside class="flow-controls" aria-label="Flow display controls" hidden>
    <div class="flow-control">
      <label for="flow-darkness" title="Background darkness"><img src="img/flow-controls/Icon.png" alt="Background darkness" width="48" height="48"></label>
      <input id="flow-darkness" type="range" min="0" max="95" step="1" value="0" aria-orientation="vertical">
    </div>
    <div class="flow-control">
      <label for="flow-speed" title="Particle speed"><img src="img/flow-controls/icon2.png" alt="Particle speed" width="48" height="48"></label>
      <input id="flow-speed" type="range" min="0" max="20" step="0.1" value="10" aria-orientation="vertical">
    </div>
    <div class="flow-control">
      <label for="flow-count" title="Particle count"><img src="img/flow-controls/icon3.png" alt="Particle count" width="48" height="48"></label>
      <input id="flow-count" type="range" min="0" max="10000" step="100" value="5000" aria-orientation="vertical">
    </div>
  </aside>

  <!-- Allow dragging only while exploring the stream detail chapter. -->
  <script type="module">
    const story = document.querySelector("ml-scrollytelling");

    try {
      await customElements.whenDefined("ml-scrollytelling");
      const map = await story.mapReady();
      const updateDragging = chapterId => {
        if (chapterId === "stream-detail") {
          map.dragPan.enable();
        } else {
          map.dragPan.disable();
        }
      };

      story.addEventListener("ml-scrollytelling:chapter", event => {
        updateDragging(event.detail.chapterId);
      });
      updateDragging(story.activeChapterId);
    } catch (error) {
      console.error("Map dragging setup failed:", error);
    }
  </script>

  <!-- STREAM PARTICLE ANIMATION -->
  <script type="module">
    import { completeLoadingTask, failLoading, setLoadingDetail } from "./js/startup.js";
    const story = document.querySelector("ml-scrollytelling");

    const SETTINGS = {
      geojson: "data/streams-lines.geojson.gz",
      chapter: "stream-detail",
      particleCount: 5000,
      speed: 10,
      metresPerSecond: 1000,
      updateInterval: 30,
      particleRadius: 2,
      particleColor: "#A8F3FF"
    };

    const SOURCE_ID = "animated-water-source";
    const LAYER_ID = "animated-water-particles";

    const emptyGeoJSON = () => ({
      type: "FeatureCollection",
      features: []
    });

    let map;
    let paths = [];
    let particles = [];
    let running = false;
    let frameID = null;
    let lastUpdate = 0;
    let chapterToken = 0;
    let pendingMoveEnd = null;
    const controls = document.querySelector(".flow-controls");
    const darknessInput = document.getElementById("flow-darkness");
    const speedInput = document.getElementById("flow-speed");
    const countInput = document.getElementById("flow-count");
    const rasterBrightness = new Map();

    function updateBackground() {
      if (!map) return;
      const factor = controls.hidden ? 1 : 1 - Number(darknessInput.value) / 100;
      for (const [id, brightness] of rasterBrightness) {
        map.setPaintProperty(id, "raster-brightness-min", brightness.min * factor);
        map.setPaintProperty(id, "raster-brightness-max", brightness.max * factor);
      }
    }

    function updateControls(chapterId) {
      controls.hidden = chapterId !== SETTINGS.chapter;
      updateBackground();
    }

    darknessInput.addEventListener("input", () => {
      updateBackground();
    });
    speedInput.addEventListener("input", () => {
      SETTINGS.speed = Number(speedInput.value);
    });
    countInput.addEventListener("input", () => {
      SETTINGS.particleCount = Number(countInput.value);
      if (!paths.length) return;
      // Keep existing particles in place when changing density.
      if (particles.length > SETTINGS.particleCount) {
        particles.length = SETTINGS.particleCount;
      }
      while (particles.length < SETTINGS.particleCount) {
        particles.push(createParticle());
      }
      if (!particles.length && map) {
        map.getSource(SOURCE_ID)?.setData(emptyGeoJSON());
      }
      if (map && story.activeChapterId === SETTINGS.chapter && !map.isMoving()) {
        startParticles();
      }
    });

    // Identify the active chapter as soon as it changes.
    story.addEventListener("ml-scrollytelling:chapter", event => {
      const chapterId = event.detail.chapterId;
      handleChapter(chapterId);
    });

    // Prepare coordinates along each stream.
    function addPath(coordinates) {
      if (!Array.isArray(coordinates) || coordinates.length < 2) return;

      const points = [];
      const distances = [];
      let total = 0;

      for (const coordinate of coordinates) {
        const lon = Number(coordinate[0]);
        const lat = Number(coordinate[1]);

        if (!Number.isFinite(lon) ||
            !Number.isFinite(lat) ||
            Math.abs(lat) > 90) continue;

        if (points.length > 0) {
          const previous = points[points.length - 1];

          const radians = Math.PI / 180;
          const dLat = (lat - previous[1]) * radians;
          const dLon = (lon - previous[0]) * radians;
          const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(previous[1] * radians) * Math.cos(lat * radians) *
            Math.sin(dLon / 2) ** 2;
          total += 6371008.8 * 2 * Math.asin(Math.sqrt(Math.min(1, a)));
        }

        points.push([lon, lat]);
        distances.push(total);
      }

      if (points.length > 1 && total > 0) {
        paths.push({ points, distances, total, next: null });
      }
    }

    // The GIS lines run downstream. Match endpoints at export precision;
    // do not bridge nearby but disconnected drainage pathways.
    function connectPaths() {
      const endpointKey = point => point.map(value => value.toFixed(6)).join(",");
      const starts = new Map();
      for (const path of paths) {
        starts.set(endpointKey(path.points[0]), path);
      }
      for (const path of paths) {
        const next = starts.get(endpointKey(path.points[path.points.length - 1]));
        path.next = next && next !== path ? next : null;
      }
    }

    // Find an interpolated point on a stream.
    function pointAlongPath(path, fraction) {
      const target = fraction * path.total;
      const distances = path.distances;

      let low = 1;
      let high = distances.length - 1;

      while (low < high) {
        const middle = Math.floor((low + high) / 2);

        if (distances[middle] < target) {
          low = middle + 1;
        } else {
          high = middle;
        }
      }

      const index = low;
      const start = path.points[index - 1];
      const end = path.points[index];

      const segment = distances[index] - distances[index - 1];

      const t = segment > 0
        ? (target - distances[index - 1]) / segment
        : 0;

      return [
        start[0] + (end[0] - start[0]) * t,
        start[1] + (end[1] - start[1]) * t
      ];
    }

    function createParticle(randomPosition = true) {
      const path = paths[Math.floor(Math.random() * paths.length)];
      return {
        path,
        distance: randomPosition ? Math.random() * path.total : 0
      };
    }

    function advanceParticle(particle, dt) {
      // All particles travel the same ground distance per second, including
      // after a slider change or a transition to a different-length line.
      particle.distance += dt * SETTINGS.metresPerSecond * SETTINGS.speed;
      while (particle.distance >= particle.path.total) {
        particle.distance -= particle.path.total;
        if (!particle.path.next) {
          // Re-seed only at an endpoint with no mapped downstream line.
          Object.assign(particle, createParticle(false));
          return;
        }
        particle.path = particle.path.next;
      }
    }

    function createParticles() {
      particles = Array.from(
        { length: SETTINGS.particleCount },
        () => createParticle()
      );
    }

    // Draw the updated particle positions.
    function drawParticles(timestamp) {
      if (!running) return;

      if (timestamp - lastUpdate >= SETTINGS.updateInterval) {
        const dt = lastUpdate
          ? Math.min((timestamp - lastUpdate) / 1000, 0.1)
          : 0;

        lastUpdate = timestamp;

        const features = particles.map(particle => {
          advanceParticle(particle, dt);

          return {
            type: "Feature",
            properties: {},
            geometry: {
              type: "Point",
              coordinates: pointAlongPath(
                particle.path, particle.distance / particle.path.total
              )
            }
          };
        });

        const source = map.getSource(SOURCE_ID);

        if (source) {
          source.setData({
            type: "FeatureCollection",
            features
          });
        }
      }

      frameID = requestAnimationFrame(drawParticles);
    }

    function stopParticles() {
      running = false;

      if (frameID !== null) {
        cancelAnimationFrame(frameID);
        frameID = null;
      }

      lastUpdate = 0;

      if (map && map.getSource(SOURCE_ID)) {
        map.getSource(SOURCE_ID).setData(emptyGeoJSON());
      }
    }

    function startParticles() {
      if (running || !map || particles.length === 0) return;
      if (document.hidden) return;

      running = true;
      lastUpdate = 0;
      frameID = requestAnimationFrame(drawParticles);
    }

    // Start only after zooming has finished.
    function handleChapter(chapterId) {
      const token = ++chapterToken;
      updateControls(chapterId);

      if (map && pendingMoveEnd) {
        map.off("moveend", pendingMoveEnd);
        pendingMoveEnd = null;
      }

      stopParticles();

      if (chapterId !== SETTINGS.chapter || !map) return;

      // Ignore camera movements that belong to older chapters.
      const beginAfterZoom = () => {
        pendingMoveEnd = null;

        if (
          token === chapterToken &&
          story.activeChapterId === SETTINGS.chapter &&
          !map.isMoving()
        ) {
          startParticles();
        }
      };

      if (map.isMoving()) {
        pendingMoveEnd = beginAfterZoom;
        map.once("moveend", pendingMoveEnd);
      } else {
        // Allow the story to initiate its camera transition.
        requestAnimationFrame(() => {
          if (token !== chapterToken) return;

          if (map.isMoving()) {
            pendingMoveEnd = beginAfterZoom;
            map.once("moveend", pendingMoveEnd);
          } else {
            beginAfterZoom();
          }
        });
      }
    }

    async function initialize() {
      try {
        await customElements.whenDefined("ml-scrollytelling");
        map = await story.mapReady();

        for (const layer of map.getStyle().layers) {
          if (layer.type !== "raster") continue;
          rasterBrightness.set(layer.id, {
            min: map.getPaintProperty(layer.id, "raster-brightness-min") ?? 0,
            max: map.getPaintProperty(layer.id, "raster-brightness-max") ?? 1
          });
        }
        updateControls(story.activeChapterId);

        map.addSource(SOURCE_ID, {
          type: "geojson",
          data: emptyGeoJSON()
        });

        map.addLayer({
          id: LAYER_ID,
          type: "circle",
          source: SOURCE_ID,
          paint: {
            "circle-radius": SETTINGS.particleRadius,
            "circle-color": SETTINGS.particleColor,
            "circle-opacity": 0.95,
            "circle-blur": 0.2
          }
        });

        setLoadingDetail("streams", "Downloading stream data");
        const response = await fetch(SETTINGS.geojson);

        if (!response.ok) {
          throw new Error("GeoJSON load failed: " + response.status);
        }

        setLoadingDetail("streams", "Preparing stream paths");
        // Let the loading screen paint before parsing the large dataset.
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        // Decode the full line dataset once for both the map and particles.
        const data = await new Response(
          response.body.pipeThrough(new DecompressionStream("gzip"))
        ).json();

        const streamLayer = map.getLayer("stream-ice-8000");
        map.getSource(streamLayer.source).setData(data);

        let processed = 0;
        for (const feature of data.features || []) {
          const geometry = feature.geometry;
          if (!geometry) continue;

          if (geometry.type === "LineString") {
            addPath(geometry.coordinates);
          } else if (geometry.type === "MultiLineString") {
            for (const line of geometry.coordinates) {
              addPath(line);
            }
          }
          // Keep the loading screen responsive while building the network.
          if (++processed % 10000 === 0) {
            await new Promise(resolve => setTimeout(resolve, 0));
          }
        }

        if (paths.length === 0) {
          throw new Error("No usable stream paths found.");
        }

        connectPaths();
        createParticles();

        console.log("Stream paths:", paths.length);
        console.log("Particles:", particles.length);

        // Initialize the current chapter after data loading.
        handleChapter(story.activeChapterId);
        completeLoadingTask("streams");

      } catch (error) {
        console.error("Particle animation error:", error);
        failLoading(error);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopParticles();
      } else if (map) {
        handleChapter(story.activeChapterId);
      }
    });

    initialize();
  </script>
</body>
</html>
